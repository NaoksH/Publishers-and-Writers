name: Fetch RSS feeds

on:
  schedule:
    # UTCで3時間おき（日本時間 9,12,15,18,21,0,3,6時ごろ）
    - cron: '0 */3 * * *'
  workflow_dispatch: {}

permissions:
  contents: write

# 同時に複数のワークフローが動いて push がぶつからないようにする
concurrency:
  group: fetch-feeds
  cancel-in-progress: false

jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Fetch feeds
        run: node scripts/fetch-feeds.mjs

      - name: Commit feeds.json if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add feeds.json
          if git diff --cached --quiet; then
            echo "feeds.json に変更なし。コミットをスキップします。"
            exit 0
          fi
          git commit -m "chore: update feeds.json [skip ci]"
          # 実行中にリポジトリが先へ進んでいた場合に備えて、push前に取り込んでおく
          git pull --rebase origin main
          git push origin HEAD:main
